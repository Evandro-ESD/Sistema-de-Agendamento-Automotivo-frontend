<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm"
>
  <div class="h-14 max-w-7xl mx-auto px-6 flex items-center justify-between">
    <!-- LEFT -->
    <div class="flex items-center gap-4">
      <!-- MOBILE BUTTON -->
      <button
        (click)="toggleMenu()"
        class="lg:hidden w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-[#0A2647] hover:bg-slate-100 transition"
      >
        {{ menuOpen() ? "✕" : "☰" }}
      </button>

      <!-- LOGO -->
      <a routerLink="/" class="flex items-center gap-3">
        <img
          src="assets/logos/logo.png"
          alt="Logo"
          class="h-11 object-contain"
        />

        <div class="hidden sm:flex flex-col">
          <span class="text-[#0A2647] font-bold text-lg leading-none">
            Oficina Inteligente
          </span>

          <span class="text-xs text-gray-500"> Plataforma Automotiva </span>
        </div>
      </a>
    </div>

    <!-- NAV DESKTOP -->
    <nav class="hidden lg:flex items-center content-center gap-4 m-4">
      <a
        href="#beneficios"
        class="text-gray-600 hover:text-[#0A2647] transition font-medium"
      >
        Benefícios
      </a>

      <a
        href="#recursos"
        class="text-gray-600 hover:text-[#0A2647] transition font-medium"
      >
        Principais recursos
      </a>

      <!-- DROPDOWN -->
      <app-dropdown title="Agende seu serviço" [items]="menuDropdown" />
      <app-dropdown title="Onde estamos" [items]="menuDropdownContact" />

      <a
        href="#"
        class="text-gray-600 hover:text-[#0A2647] transition font-medium"
      >
        Contato
      </a>
    </nav>

    <!-- ACTIONS -->
    <div class="flex items-center gap-3">
      <a
        routerLink="/login-associate"
        class="hidden md:flex h-11 px-5 items-center justify-center rounded-xl border border-slate-300 text-[#0A2647] font-medium hover:bg-slate-100 transition"
      >
        Entrar
      </a>

      <a
        routerLink="/register"
        class="hidden md:flex h-11 px-5 items-center justify-center rounded-xl bg-[#D4AF37] text-[#0A2647] font-semibold hover:brightness-105 transition"
      >
        Credenciar Oficina
      </a>
    </div>
  </div>

  <!-- MOBILE MENU -->
  @if (menuOpen()) {
    <div
      class="lg:hidden border-t border-slate-200 bg-white px-6 py-5 shadow-sm"
    >
      <nav class="flex flex-col gap-2">
        <a
          href="#beneficios"
          class="px-4 py-3 rounded-xl text-gray-700 hover:bg-slate-100 transition"
        >
          Benefícios
        </a>

        <a
          href="#recursos"
          class="px-4 py-3 rounded-xl text-gray-700 hover:bg-slate-100 transition"
        >
          Principais recursos
        </a>

        <!-- DROPDOWN -->
        <div class="px-4 py-3">
          <app-dropdown title="Agende seu serviço" [items]="menuDropdown" />
        </div>
        <div class="px-4 py-3">
          <app-dropdown title="Onde estamos" [items]="menuDropdownContact" />
        </div>

        <a
          href="#"
          class="px-4 py-3 rounded-xl text-gray-700 hover:bg-slate-100 transition"
        >
          Contato
        </a>

        <!-- MOBILE ACTIONS -->
        <div class="flex flex-col gap-3 pt-4">
          <a
            routerLink="/login-associate"
            class="h-11 flex items-center justify-center rounded-xl border border-slate-300 text-[#0A2647] font-medium hover:bg-slate-100 transition"
          >
            Entrar
          </a>

          <a
            routerLink="/register"
            class="h-11 flex items-center justify-center rounded-xl bg-[#D4AF37] text-[#0A2647] font-semibold hover:brightness-105 transition"
          >
            Credenciar Oficina
          </a>
        </div>
      </nav>
    </div>
  }
</header>
