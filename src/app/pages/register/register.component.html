<div class="min-h-screen bg-gray-100">
  <!-- HEADER -->

  <app-header />

  <!-- HERO -->

  <app-hero />

  <!-- CARD -->

  <section
    class="bg-white mx-4 md:max-w-xl md:mx-auto rounded-2xl shadow-xl overflow-hidden -mt-4 relative"
  >
    <!-- TOP -->

    <div class="bg-red-500 text-white px-6 py-5 text-xl font-semibold">
      CRIAR CONTA
    </div>

    <!-- TABS -->

    <div class="grid grid-cols-2">
      <a
        routerLink="/login"
        class="h-16 flex items-center justify-center bg-gray-100 text-gray-500 font-semibold hover:bg-gray-200 transition"
      >
        LOGIN
      </a>

      <button
        class="h-16 bg-white text-red-500 font-semibold border-b-2 border-red-500"
      >
        CADASTRO
      </button>
    </div>

    <!-- FORM -->

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="p-5 md:p-10 space-y-6"
    >
      <!-- TITLE -->

      <div class="space-y-2">
        <h2 class="text-gray-500 uppercase font-semibold text-lg">
          Cadastro de associado
        </h2>

        <p class="text-gray-500">
          Crie sua conta para acessar os serviços automotivos.
        </p>
      </div>

      <!-- INPUTS -->

      <div class="space-y-5">
        <app-input
          label="Nome"
          placeholder="Digite seu nome"
          formControlName="nome"
        />

        <app-input
          label="E-mail"
          type="email"
          placeholder="Digite seu e-mail"
          formControlName="email"
        />

        <app-input
          label="Senha"
          type="password"
          placeholder="Crie uma senha"
          formControlName="password"
        />
      </div>

      <!-- ERROR -->

      <div
        *ngIf="errorMsg"
        class="bg-red-100 border border-red-300 text-red-600 rounded-xl p-4"
      >
        {{ errorMsg }}
      </div>

      <!-- BUTTON -->

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full h-16 rounded-2xl bg-red-500 text-white text-2xl font-semibold shadow-lg hover:scale-[1.01] hover:bg-red-600 transition disabled:opacity-50 disabled:hover:scale-100"
      >
        REGISTRAR
      </button>

      <!-- LOGIN -->

      <div class="text-center text-gray-500">
        Já possui conta?

        <a
          routerLink="/login"
          class="text-red-500 font-semibold hover:underline"
        >
          Entrar
        </a>
      </div>
    </form>
  </section>

  <!-- FOOTER -->

  <app-footer />
</div>
