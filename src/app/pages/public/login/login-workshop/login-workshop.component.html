<div
  class="min-h-screen bg-linear-to-br from-[#F5F7FA] via-white to-[#EAF4FB] px-4 py-10"
>
  <section
    class="bg-white max-w-xl mx-auto rounded-3xl shadow-2xl overflow-hidden border border-slate-200"
  >
    <!-- HEADER -->
    <div
      class="bg-[#0A2647] text-white px-8 py-6 flex items-center justify-between"
    >
      <div>
        <h1 class="text-2xl font-bold">Área da Oficina</h1>

        <p class="text-sm text-slate-300 mt-1">
          Gerencie ordens de serviço e agendamentos
        </p>
      </div>

      <div
        class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-2xl"
      >
        🛠️
      </div>
    </div>

    <!-- TABS -->
    <div class="flex bg-slate-100 border-b border-slate-200 px-4 pt-4">
      <!-- ASSOCIADO -->
      <a
        [routerLink]="['/login-associate']"
        class="relative flex-1 px-6 py-4 rounded-t-2xl text-center text-slate-500 font-semibold bg-slate-200 transition-all duration-300 hover:bg-slate-300"
      >
        <div class="flex flex-col items-center">
          <span class="text-lg leading-tight"> LOGIN ASSOCIADO </span>

          <span class="text-xs text-slate-400 mt-1"> Área do associado </span>
        </div>
      </a>

      <!-- OFICINA -->
      <a
        [routerLink]="['/login-workshop']"
        routerLinkActive="bg-white text-[#0A2647] shadow-sm z-20"
        class="relative -ml-2 flex-1 px-6 py-4 rounded-t-2xl text-center text-slate-500 font-semibold transition-all duration-300"
      >
        <div class="flex flex-col items-center">
          <span class="text-lg leading-tight"> LOGIN OFICINA </span>

          <span class="text-xs text-slate-400 mt-1">
            Painel administrativo
          </span>
        </div>
      </a>
    </div>

    <!-- FORM -->
    <div class="p-8">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-[#0A2647]">Bem-vindo</h2>

        <p class="mt-2 text-slate-500">Faça login no painel da oficina.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- EMAIL -->
        <div>
          <label class="block mb-2 text-sm font-semibold text-slate-700">
            Email
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Digite seu email"
            class="w-full px-5 py-4 rounded-2xl border border-slate-300 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#0A2647]"
          />
        </div>

        <!-- SENHA -->
        <div>
          <label class="block mb-2 text-sm font-semibold text-slate-700">
            Senha
          </label>

          <input
            type="password"
            formControlName="password"
            placeholder="Digite sua senha"
            class="w-full px-5 py-4 rounded-2xl border border-slate-300 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#0A2647]"
          />
        </div>

        <!-- BOTÃO -->
        <button
          type="submit"
          [disabled]="form.invalid || loading"
          class="w-full py-4 rounded-2xl bg-[#0A2647] text-white text-lg font-semibold shadow-lg transition-all duration-300 hover:shadow-2xl"
        >
          <span *ngIf="!loading"> Entrar </span>

          <span *ngIf="loading"> Entrando... </span>
        </button>
      </form>
    </div>
  </section>
</div>
