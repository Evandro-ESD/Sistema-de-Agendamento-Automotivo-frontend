<div class="min-h-screen bg-gray-100">
  <!-- HEADER -->

  <app-header />

  <!-- HERO -->

  <app-hero />

  <!-- CARD -->

  <section
    class="bg-white mx-4 md:max-w-xl md:mx-auto rounded-2xl shadow-xl overflow-hidden -mt-4 relative"
  >
    <!-- TOP -->

    <div class="bg-red-500 text-white px-6 py-5 text-xl font-semibold">
      ACESSAR SISTEMA
    </div>

    <!-- TABS -->

    <div class="grid grid-cols-2">
      <button
        class="h-16 bg-white text-red-500 font-semibold border-b-2 border-red-500"
      >
        LOGIN
      </button>

      <a
        routerLink="/register"
        class="h-16 flex items-center justify-center bg-gray-100 text-gray-500 font-semibold hover:bg-gray-200 transition"
      >
        CADASTRO
      </a>
    </div>

    <!-- FORM -->

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="p-5 md:p-10 space-y-6"
    >
      <!-- TITLE -->

      <div class="space-y-2">
        <h2 class="text-gray-500 uppercase font-semibold text-lg">
          Login do associado
        </h2>

        <p class="text-gray-500">
          Entre com suas credenciais para acessar o sistema.
        </p>
      </div>

      <!-- INPUTS -->

      <!-- <div class="space-y-5">
        <app-input
          label="E-mail"
          type="email"
          placeholder="Digite seu e-mail"
          formControlName="email"
        />

        <app-input
          label="Senha"
          type="password"
          placeholder="Digite sua senha"
          formControlName="password"
        />
      </div> -->
      <div class="space-y-5">
        <!-- EMAIL -->

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-600"> E-mail </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Digite seu e-mail"
            class="w-full h-14 rounded-xl border border-gray-300 px-4 text-lg outline-none focus:border-red-400 transition"
          />
        </div>

        <!-- PASSWORD -->

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-600"> Senha </label>

          <input
            type="password"
            formControlName="password"
            placeholder="Digite sua senha"
            class="w-full h-14 rounded-xl border border-gray-300 px-4 text-lg outline-none focus:border-red-400 transition"
          />
        </div>
      </div>

      <!-- ERROR -->

      <div
        *ngIf="errorMsg"
        class="bg-red-100 border border-red-300 text-red-600 rounded-xl p-4"
      >
        {{ errorMsg }}
      </div>

      <!-- BUTTON -->

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full h-16 rounded-2xl bg-red-500 text-white text-2xl font-semibold shadow-lg hover:scale-[1.01] hover:bg-red-600 transition disabled:opacity-50 disabled:hover:scale-100"
      >
        ENTRAR
      </button>

      <!-- REGISTER -->

      <div class="text-center text-gray-500">
        Não possui conta?

        <a
          routerLink="/register"
          class="text-red-500 font-semibold hover:underline"
        >
          Cadastre-se
        </a>
      </div>
    </form>
  </section>

  <!-- FOOTER -->

  <app-footer />
</div>
