<div class="space-y-6">
  <!-- HEADER -->

  <div>
    <h1 class="text-3xl font-bold text-gray-800">AGENDAMENTOS</h1>

    <p class="text-gray-500 mt-1">Gerencie os serviços e horários.</p>
  </div>

  <!-- FORM -->

  <section
    *ngIf="user?.role === 'associado'"
    class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"
  >
    <div class="bg-red-500 text-white px-6 py-4 font-semibold text-lg">
      NOVO AGENDAMENTO
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="criar()"
      class="p-6 grid md:grid-cols-2 gap-5"
    >
      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-600"> Oficina</label>

        <select formControlName="oficina_id" class="input">
          <option value="">Selecione uma oficina</option>
          @for (oficina of lista_oficinas; track oficina.id) {
            <option [value]="oficina.id">{{ oficina.nome }}</option>
          }
        </select>
        <!-- <input type="text" formControlName="oficina_id" class="input" /> -->
        <!-- placeholder="Nome da oficina" -->
      </div>

      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-600"> Data </label>

        <input type="date" formControlName="data" class="input" />
      </div>

      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-600"> Horário </label>

        <select formControlName="hora" class="input">
          <option value="">Selecione um horário</option>

          @for (hora of horarios; track hora) {
            <option [value]="hora">
              {{ hora }}
            </option>
          }
        </select>
      </div>

      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-600"> Serviço </label>

        <select
          formControlName="servico_id"
          class="input"
          [disabled]="!form.get('oficina_id')?.value"
        >
          <option value="">Selecione um serviço</option>
          @for (serv of servicosDisponiveis; track serv.id) {
            <option [value]="serv.id">
              {{ serv.nome }} - R$ {{ serv.valor }}
            </option>
          }
        </select>
      </div>

      <!-- <div class="space-y-2">
        <select
          formControlName="veiculo_id"
          class="input"
          *ngIf="user?.role === 'associado'"
        >
          <option value="">Selecione o veículo</option>
          @for (veic of veiculosDoAssociado; track veic.id) {
            <option [value]="veic.id">
              {{ veic.marca }} {{ veic.modelo }} - {{ veic.placa }}
            </option>
          }
        </select>
      </div> -->

      <div class="md:col-span-2">
        <button
          type="submit"
          class="w-full h-14 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition"
        >
          AGENDAR
        </button>
      </div>

      <div
        *ngIf="erro"
        class="md:col-span-2 bg-red-100 border border-red-300 text-red-600 rounded-xl p-4"
      >
        {{ erro }}
      </div>
    </form>
  </section>

  <!-- TABLE -->

  <section
    class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"
  >
    <div class="px-6 py-5 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-700">LISTA DE SERVIÇOS</h2>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-100">
          <tr>
            <th class="text-left px-6 py-4">Data/Hora</th>

            <th class="text-left px-6 py-4">Serviço</th>

            <th class="text-left px-6 py-4">Oficina</th>

            <th class="text-left px-6 py-4">Status</th>

            <th class="text-left px-6 py-4">Ações</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let a of agendamentos"
            class="border-t border-gray-100 hover:bg-gray-50"
          >
            <td class="px-6 py-4">
              {{ a.data_hora | date: "dd/MM/yyyy HH:mm" }}
            </td>

            <td class="px-6 py-4">
              {{ a.servico_nome }}
            </td>

            <td class="px-6 py-4">
              {{ a.oficina_nome }}
            </td>

            <td class="px-6 py-4">
              <span
                class="px-3 py-1 rounded-full text-sm bg-red-100 text-red-600"
              >
                {{ a.status }}
              </span>
            </td>

            <td class="px-6 py-4">
              <div class="flex flex-wrap gap-2">
                <button
                  *ngIf="a.status === 'AGENDADO'"
                  (click)="cancelar(a.id)"
                  class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition"
                >
                  Cancelar
                </button>

                <button
                  *ngIf="
                    user?.role === 'associado' && a.status === 'EM_ANDAMENTO'
                  "
                  (click)="finalizar(a.id, 'FINALIZADO_ASSOCIADO')"
                  class="px-4 py-2 rounded-lg bg-green-500 text-white"
                >
                  Finalizar
                </button>

                <button
                  *ngIf="
                    user?.role === 'admin_oficina' &&
                    a.status === 'EM_ANDAMENTO'
                  "
                  (click)="finalizar(a.id, 'FINALIZADO_OFICINA')"
                  class="px-4 py-2 rounded-lg bg-blue-500 text-white"
                >
                  Concluir
                </button>

                <input
                  *ngIf="
                    user?.role === 'admin_oficina' &&
                    a.status === 'FINALIZADO_OFICINA'
                  "
                  type="file"
                  accept="application/pdf"
                  (change)="onFileChange($event, a.id)"
                  class="text-sm border rounded-lg p-2"
                />
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
