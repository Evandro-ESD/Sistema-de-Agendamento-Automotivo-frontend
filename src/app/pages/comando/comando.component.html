
<div class="min-h-screen bg-gray-100 flex">
  <!-- SIDEBAR -->

  <aside
    class="
      fixed
      md:static
      z-50
      top-0
      left-0
      h-screen
      w-72
      bg-black
      border-r-2
      border-red-500
      transform
      transition-transform
      duration-300
      flex
      flex-col
    "
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen"
    [class.md:translate-x-0]="true"
  >
    <!-- HEADER -->

    <div
      class="
        h-20
        border-b
        border-red-500
        flex
        items-center
        justify-between
        px-6
      "
    >
      <h1
        class="
          text-2xl
          font-bold
          text-white
          tracking-wide
        "
      >
        COMANDO
      </h1>

      <button
        class="md:hidden text-red-500 text-3xl"
        (click)="toggleSidebar()"
      >
        ✕
      </button>
    </div>

    <!-- USER -->

    <div class="p-6 border-b border-gray-800">
      <p class="text-gray-400 text-sm">
        Usuário logado
      </p>

      <h2 class="text-white font-semibold text-lg">
        {{ user?.nome }}
      </h2>

      <span
        class="
          inline-block
          mt-2
          px-3
          py-1
          rounded-full
          bg-red-500
          text-white
          text-xs
          uppercase
          tracking-wide
        "
      >
        {{ user?.role }}
      </span>
    </div>

    <!-- MENU -->

    <nav class="flex-1 p-4 space-y-2">
      <a
        routerLink="agendamentos"
        routerLinkActive="bg-red-500 text-white"
        class="
          flex
          items-center
          gap-3
          h-14
          px-4
          rounded-xl
          text-gray-300
          hover:bg-gray-900
          transition
        "
      >
        📍 AGENDAMENTOS
      </a>

      <a
        *ngIf="isAdminGeral()"
        routerLink="oficinas"
        routerLinkActive="bg-red-500 text-white"
        class="
          flex
          items-center
          gap-3
          h-14
          px-4
          rounded-xl
          text-gray-300
          hover:bg-gray-900
          transition
        "
      >
        🏢 OFICINAS
      </a>

      <a
        *ngIf="isAdminOficina()"
        routerLink="operacoes"
        routerLinkActive="bg-red-500 text-white"
        class="
          flex
          items-center
          gap-3
          h-14
          px-4
          rounded-xl
          text-gray-300
          hover:bg-gray-900
          transition
        "
      >
        🔧 OPERAÇÕES
      </a>

      <a
        *ngIf="
          isAdminGeral() ||
          isAdminOficina()
        "
        routerLink="relatorios"
        routerLinkActive="bg-red-500 text-white"
        class="
          flex
          items-center
          gap-3
          h-14
          px-4
          rounded-xl
          text-gray-300
          hover:bg-gray-900
          transition
        "
      >
        📊 RELATÓRIOS
      </a>
    </nav>

    <!-- FOOTER -->

    <div class="p-4 border-t border-gray-800">
      <button
        (click)="logout()"
        class="
          w-full
          h-14
          rounded-xl
          bg-red-500
          text-white
          font-semibold
          hover:bg-red-600
          transition
        "
      >
        SAIR
      </button>
    </div>
  </aside>

  <!-- OVERLAY MOBILE -->

  <div
    *ngIf="sidebarOpen"
    class="
      fixed
      inset-0
      bg-black/50
      z-40
      md:hidden
    "
    (click)="toggleSidebar()"
  ></div>

  <!-- CONTENT -->

  <div class="flex-1 flex flex-col min-h-screen">
    <!-- TOPBAR -->

    <header
      class="
        h-20
        bg-white
        border-b
        border-gray-200
        flex
        items-center
        justify-between
        px-4
        md:px-8
        shadow-sm
      "
    >
      <button
        class="md:hidden text-3xl text-red-500"
        (click)="toggleSidebar()"
      >
        ☰
      </button>

      <div class="ml-auto text-right">
        <p class="text-sm text-gray-500">
          Bem-vindo
        </p>

        <h2
          class="
            text-lg
            font-semibold
            text-gray-700
          "
        >
          {{ user?.nome }}
        </h2>
      </div>
    </header>

    <!-- PAGE -->

    <main class="p-4 md:p-8 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
